[workspace]
resolver = "2"
members = [
    "crates/svf-core",
    "crates/svf-render",
    "apps/explorer",
]
default-members = [
    "crates/svf-core",
    "crates/svf-render",
    "apps/explorer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = ""
authors = []

[workspace.dependencies]
wgpu = "30.0.1"
winit = "0.30.13"
pollster = "0.4"
tracing = "0.1"
glam = { version = "=0.34.2", default-features = false, features = ["std", "float-types"] }
bytemuck = { version = "1.21", features = ["derive"] }
